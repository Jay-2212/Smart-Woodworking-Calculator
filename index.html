<!DOCTYPE html>
<html lang="en">
<!--
================================================================================
AMBICA WOODEN WORKS - SMART CFT CALCULATOR
================================================================================

PURPOSE:
Main entry point for the Smart Woodworking Calculator application.
This file loads all external dependencies and modular JavaScript files.

ARCHITECTURE:
This app has been modularized for better maintainability. See ARCHITECTURE.md
for complete documentation.

FILE STRUCTURE:
├── index.html              (This file - entry point)
├── ARCHITECTURE.md         (Documentation of the codebase structure)
├── styles/
│   └── main.css           (All CSS utility classes)
└── js/
    ├── constants.js       (Magic numbers, icons, error boundary)
    ├── calculations.js    (Pure CFT calculation functions)
    ├── three-scene.js     (3D structural preview using Three.js)
    ├── components.js      (Reusable UI components)
    └── app.js             (Main application state and rendering)

LOAD ORDER (CRITICAL):
JavaScript files MUST be loaded in this exact order:
1. constants.js      (no dependencies)
2. calculations.js   (needs constants.js)
3. three-scene.js    (needs calculations.js)
4. components.js     (needs constants.js, calculations.js)
5. app.js            (needs all above)

Customer pages do not load legacy test scripts. The supported browser suite is
Playwright (`npm test`); see README.md for setup.

================================================================================
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambica Wooden Works - Smart CFT Calculator</title>

    <!-- ====================================================================
         LOCAL DEPENDENCIES
         ==================================================================== -->
    
    <!-- Project-local lightweight renderer; this is not the React library. -->
    <script src="libs/react-simple.js"></script>
    
    <!-- Vendored official Three.js r160 and a locally adapted OrbitControls wrapper. -->
    <script src="libs/three.min.js"></script>
    <script src="libs/OrbitControlsGlobal.js"></script>

    <!-- ====================================================================
         APPLICATION STYLES
         File: styles/main.css
         Contains: All CSS utility classes (Tailwind-like)
         ==================================================================== -->
    <link rel="stylesheet" href="styles/main.css">

    <!-- 
         FALLBACK: Minimal critical styles
         In case external CSS fails to load
    -->
    <style>
        /* Critical reset */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #fef3c7; }
        #root { max-width: 42rem; margin: 0 auto; padding: 1rem; }
    </style>
</head>

<body class="bg-amber-50 text-slate-900 font-sans pb-40 wood-pattern">

    <!-- 
         APPLICATION ROOT
         The project-local lightweight renderer will render the app here via js/app.js
    -->
    <div id="root">
        <!-- Loading indicator shown while scripts load -->
        <div style="text-align: center; padding: 4rem 1rem;">
            <h1 style="font-family: Georgia, serif; font-size: 1.5rem; color: #f59e0b; margin-bottom: 1rem;">
                Ambica Wooden Works
            </h1>
            <p style="color: #64748b;">Loading Smart CFT Calculator...</p>
        </div>
    </div>

    <!-- ====================================================================
         APPLICATION MODULES
         
         IMPORTANT: Load order matters! Each module depends on previous ones.
         See ARCHITECTURE.md for detailed dependency documentation.
         ==================================================================== -->

    <!-- 
         Module 1: CONSTANTS
         File: js/constants.js
         Dependencies: None (loads first)
         Exports: HALF_FOOT_THRESHOLD, CUBIC_INCH_TO_CFT_DIVISOR, INCHES_PER_FOOT,
                  RUNNER_RECOMMENDATIONS, MIN_RUNNER_COUNT, isInvalidNumber,
                  Icon, Icons, ErrorBoundary
    -->
    <script src="js/constants.js"></script>

    <!-- 
         Module 2: CALCULATIONS
         File: js/calculations.js
         Dependencies: js/constants.js
         Exports: getPurchasedFeet, calculateLineCFT, getSizeDims, getMaxDim,
                  calculateCrateEffectiveLength, getEffectiveCrateDims
    -->
    <script src="js/calculations.js"></script>

    <!-- 
         Module 3: 3D VISUALIZATION
         File: js/three-scene.js
         Dependencies: js/calculations.js, Three.js
         Exports: ThreeScene
    -->
    <script src="js/three-scene.js"></script>

    <!-- 
         Module 4: UI COMPONENTS
         File: js/components.js
         Dependencies: js/constants.js, js/calculations.js
         Exports: NumberInput, CalculationRow, SupportCard, BoxTypeSelector
    -->
    <script src="js/components.js"></script>

    <!-- 
         Module 5: MAIN APPLICATION
         File: js/app.js
         Dependencies: All above modules
         Exports: App (main component)
         Note: This script initializes the lightweight renderer and renders the app
    -->
    <script src="js/app.js"></script>

</body>

</html>

<!-- 
================================================================================
END OF FILE

For development and debugging:
- Customer pages load only the runtime scripts above.
- Run `npm test` for the maintained Playwright browser suite.
- Legacy `js/tests.js` and `js/tests-comprehensive.js` remain in source control
  for historical reference and are intentionally not production-loaded.

For documentation:
- See ARCHITECTURE.md for complete module documentation
- Each js/*.js file has detailed JSDoc comments

================================================================================
-->
